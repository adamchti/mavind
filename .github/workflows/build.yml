name: build-iso

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "package tier"
        default: compat
        type: choice
        options: [core, compat, full]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: compile + test the Rust workspace. Runs in the SAME Debian
  # release Mavind targets, so gtk4-rs links against the same libs the image has.
  # ---------------------------------------------------------------------------
  components:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    # Only the release-publish step below needs write access; everything
    # else in this job only reads.
    permissions:
      contents: write
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: RAM runner regression tests (no VM required)
        run: bash tests/test-measure-ram.sh
      - name: Toolchain + GTK dev
        run: |
          apt-get install -y --no-install-recommends \
            cargo rustc pkg-config \
            libgtk-4-dev libglib2.0-dev libgtk4-layer-shell-dev libadwaita-1-dev \
            libpango1.0-dev libcairo2-dev libwebkitgtk-6.0-dev \
            librsvg2-bin curl
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-components-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-components-
      - run: cargo build --release --workspace --locked || cargo build --release --workspace
      - run: cargo test --workspace
      - run: cargo fmt --all --check || true
      - run: cargo clippy --workspace --all-targets || true

      # Mavind's own components (mavind-shell, icons, ...) are compiled
      # straight into the image — they're not .deb packages, so plain
      # `apt upgrade` on an installed system never sees them. This publishes
      # a small bundle (binaries + icons + wallpapers, not a full ISO) that
      # `mavind-update` (Settings -> Updates) pulls down. Only on an actual
      # push to main — never for PR branches.
      - name: Publish Mavind self-update bundle
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUNDLE="$(mktemp -d)"
          mkdir -p "$BUNDLE/bin" "$BUNDLE/icons" "$BUNDLE/backgrounds"

          for b in mavind-shell mavind-settings mavind-launcher mavind-greeter \
                   mavind-oobe mavind-installer minder mavind-windows-apps \
                   mavind-system-monitor mpk mrowser; do
            [ -f "target/release/$b" ] && cp "target/release/$b" "$BUNDLE/bin/"
          done
          cp installer/mavind-install system/update/mavind-update "$BUNDLE/bin/"
          chmod 755 "$BUNDLE"/bin/*

          for f in desktop/assets/icons/*.svg apps/*/data/icons/*.svg; do
            [ -e "$f" ] && cp "$f" "$BUNDLE/icons/"
          done

          rsvg-convert -w 1920 -h 1080 desktop/assets/wallpaper.svg \
            -o "$BUNDLE/backgrounds/wallpaper.png"
          rsvg-convert -w 1920 -h 1080 desktop/assets/wallpaper-ocean.svg \
            -o "$BUNDLE/backgrounds/ocean.png"
          rsvg-convert -w 1920 -h 1080 desktop/assets/wallpaper-sunset.svg \
            -o "$BUNDLE/backgrounds/sunset.png"

          grep -vE '^\s*#|^\s*$' system/packages/core.list > "$BUNDLE/packages.txt"

          VERSION="$(git rev-parse --short HEAD)"
          tar --zstd -C "$BUNDLE" -cf mavind-update.tar.zst bin icons backgrounds packages.txt
          sha256sum mavind-update.tar.zst > mavind-update.tar.zst.sha256
          printf '%s' "$VERSION" > mavind-update.version

          if gh release view update-latest >/dev/null 2>&1; then
            gh release upload update-latest \
              mavind-update.tar.zst mavind-update.tar.zst.sha256 mavind-update.version \
              --clobber
          else
            gh release create update-latest \
              mavind-update.tar.zst mavind-update.tar.zst.sha256 mavind-update.version \
              --title "Mavind self-update (rolling)" \
              --notes "Rolling build for Settings -> Updates. Not a stable release — see docs/UPDATES.md." \
              --prerelease
          fi
          echo "published update bundle for build ${VERSION}"

  # ---------------------------------------------------------------------------
  # Full ISO build, in a privileged Debian trixie container (mmdebstrap needs
  # mount + chroot). Mirrors scripts/build.sh / build/Containerfile.
  # ---------------------------------------------------------------------------
  iso:
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 100
    container:
      image: debian:trixie
      options: --privileged
    # Push builds do `core` (prove the base OS boots); use the manual
    # "Run workflow" button with profile=compat/full for the Wine tiers.
    env:
      PROFILE: ${{ inputs.profile || 'core' }}
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            squashfs-tools xorriso mtools dosfstools \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            cargo rustc pkg-config binutils \
            libgtk-4-dev libglib2.0-dev libgtk4-layer-shell-dev libadwaita-1-dev \
            libpango1.0-dev libcairo2-dev \
            librsvg2-bin \
            zstd file rsync fakeroot uidmap
          # Mrowser (WebKitGTK) — only compiled for --profile full, but the
          # cache key + `cargo metadata` still resolve the whole workspace.
          [ "${PROFILE:-core}" = "full" ] && apt-get install -y --no-install-recommends libwebkitgtk-6.0-dev || true

      - name: Cache apt archives + cargo
        uses: actions/cache@v4
        # Explicit, shallow globs only — a "**/Cargo.toml" here would try to walk
        # build/work/rootfs (a full Debian tree) on the post-run and blow up.
        with:
          path: build/cache
          key: mavind-${{ env.PROFILE }}-${{ hashFiles('Cargo.toml', 'apps/*/Cargo.toml', 'desktop/*/Cargo.toml', 'packages/*/Cargo.toml', 'system/packages/core.list', 'system/packages/compat.list') }}
          restore-keys: mavind-${{ env.PROFILE }}-

      - name: Build Mavind.iso
        # No --keep-work in CI: the artifact has everything, and leaving the
        # rootfs around breaks later steps that scan the workspace.
        run: ./scripts/build-iso.sh --profile "$PROFILE" --out build/out/Mavind.iso

      - name: Size report
        if: always()
        run: |
          ./tests/measure-size.sh build/out/Mavind.iso | tee size-report.txt || true
          {
            echo '### Mavind size report (`'"$PROFILE"'`)'
            echo '```'
            cat size-report.txt 2>/dev/null || echo "(build did not reach a measurable state)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Headless boot smoke test (QEMU)
        run: |
          apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          # No KVM on the runner -> TCG software emulation, so allow generous time.
          ./tests/smoke-boot.sh build/out/Mavind.iso 600

      - name: Upload ISO + metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mavind-${{ env.PROFILE }}
          path: |
            build/out/Mavind.iso
            build/out/Mavind.iso.sha256
            build/out/Mavind.iso.manifest
            build/out/Mavind.iso.sizes
            size-report.txt
          if-no-files-found: warn
          retention-days: 14
